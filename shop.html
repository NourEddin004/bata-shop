<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — Bata Shop</title>
  <meta name="description" content="Bata Shop (بطة شوب) — modest sets, coats and abayas made for hijabi women. Two branches in Zarqa and Amman, delivery across Jordan.">
  <meta name="theme-color" content="#fbf8f2">
  <link rel="icon" href="assets/img/logo-instagram.jpg">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500..600&family=Gilda+Display&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css?v=35">
  <link rel="stylesheet" href="assets/css/styles.css?v=35">
</head>
<body data-page="shop">

  <main id="main">
    <section class="b-shop b-tone--cream" id="catalog">
      <div class="b-container">
        <header class="b-shop__head">
          <h1 class="b-title" data-shop-title>The collection</h1>
          <p class="b-page-head__lead">Sets, coats and abayas cut long and loose. Add what you love and choose sizes in your cart.</p>
        </header>
        <div class="b-tabs" data-tabs role="group" aria-label="Category"></div>
        <div class="b-toolbar">
          <div class="b-toolbar__filters">
            <div class="b-toolbar__shades" data-shades role="group" aria-label="Colour"></div>
            <div class="b-toolbar__shades" data-size-filter role="group" aria-label="Size"></div>
          </div>
          <form class="b-toolbar__controls" data-q-form role="search">
            <label class="b-sr" for="shop-q">Search</label>
            <input class="b-input b-input--pill" id="shop-q" type="search" placeholder="Search" data-q>
          </form>
        </div>
        <div class="b-results">
          <p class="b-toolbar__count" data-results-count></p>
          <button class="b-clear" type="button" data-clear hidden>Clear filters</button>
        </div>
        <div class="b-grid b-grid--4" data-grid></div>
      </div>
    </section>
  </main>

  <script src="assets/js/catalog.js?v=35"></script>
  <script src="assets/js/app.js?v=35"></script>
</body>
</html>
